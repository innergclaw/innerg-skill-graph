<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡️ InnerG Skill Graph ~ Nasirr "Nas" Mayo</title>
<meta name="description" content="Interactive map of Nasirr 'Nas' Mayo's skills, InnerG ecosystem, clients, SI teammates and stack. Human-led, SI-partnered.">
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
:root{--bg:#07070c;--panel:rgba(16,16,28,.92);--line:#262640;--text:#ecebff;--muted:#9a99b8;--accent:#f5c542;--accent2:#8b5cf6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:radial-gradient(ellipse at 30% 20%,#1a1033 0%,var(--bg) 60%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#graph{position:fixed;inset:0}
header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;background:linear-gradient(180deg,rgba(7,7,12,.95),rgba(7,7,12,0));pointer-events:none}
header>*{pointer-events:auto}
.brand{font-weight:800;font-size:18px;letter-spacing:.5px;margin-right:auto}
.brand span{color:var(--accent)}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
input,button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
input{width:200px}
button{cursor:pointer}button:hover,button.on{border-color:var(--accent);color:var(--accent)}
#legend{position:fixed;left:16px;bottom:16px;z-index:10;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:13px;backdrop-filter:blur(8px)}
#legend b{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.lg{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;padding:2px 4px;border-radius:6px}
.lg:hover{background:#ffffff10}.lg.off{opacity:.35}
.dot{width:11px;height:11px;border-radius:50%}
#panel{position:fixed;top:72px;right:16px;bottom:16px;width:340px;z-index:11;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;overflow:auto;transform:translateX(120%);transition:transform .25s ease;backdrop-filter:blur(10px)}
#panel.open{transform:none}
#panel h2{font-size:20px;margin:6px 0}
#panel .tag{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:2px 8px;border-radius:999px}
#panel p{color:#cfcde8;line-height:1.5;font-size:14px;margin:8px 0}
#panel h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:16px 0 6px}
#panel a{color:var(--accent);word-break:break-all;font-size:14px}
#panel ul{list-style:none}#panel li{padding:5px 0;border-bottom:1px solid #ffffff0d;font-size:14px;cursor:pointer}
#panel li:hover{color:var(--accent)}#panel li em{color:var(--muted);font-style:normal;font-size:12px}
#close{position:absolute;top:10px;right:10px;padding:2px 9px}
#stats{position:fixed;right:16px;bottom:16px;z-index:9;font-size:12px;color:var(--muted)}
@media(max-width:700px){.brand{width:100%}input{flex:1;width:auto}
#panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:55vh;transform:translateY(120%)}
#legend{bottom:8px;left:8px;font-size:12px;padding:8px;flex-direction:row;flex-wrap:wrap;right:8px}#legend b{width:100%}#stats{display:none}}
</style>
</head>
<body>
<header>
  <div class="brand"><span>⚡️</span> InnerG Skill Graph<small>Nasirr "Nas" Mayo ~ human-led, SI-partnered</small></div>
  <input id="search" placeholder="Search nodes..." autocomplete="off">
  <button id="viewBtn" title="Switch layout">Competency view</button>
  <button id="physBtn">Freeze</button>
  <button id="resetBtn">Reset</button>
  <button id="exportBtn">JSON</button>
</header>
<div id="graph"></div>
<div id="legend"><b>Groups (tap to filter)</b></div>
<aside id="panel"><button id="close">✕</button><div id="pbody"></div></aside>
<div id="stats"></div>
<script>
// ⚡️ Edit this data to update the graph. Groups: core, venture, client, agent, skill, tool, legacy
const groups = {
  core:    {label:'Core',          color:'#f5c542'},
  venture: {label:'InnerG Ecosystem',color:'#8b5cf6'},
  client:  {label:'Clients',       color:'#fb923c'},
  agent:   {label:'SI Teammates',  color:'#22d3ee'},
  skill:   {label:'Skills',        color:'#34d399'},
  tool:    {label:'Stack',         color:'#94a3b8'},
  legacy:  {label:'Legacy',        color:'#4b4b63'}
};
const GH='https://github.com/innergclaw/';
const graphData = {
nodes: [
 {id:'nas',label:'Nas (Mr G)',group:'core',size:46,desc:'Nasirr "Nas" Mayo ~ founder of the InnerG ecosystem. Builder, designer, teacher and writer from Philadelphia. Every system here is human-led, with SI as partner.',links:[['Home Base','https://nasirr.innergintel.org/'],['GitHub','https://github.com/innergclaw']]},
 {id:'homebase',label:'Home Base',group:'core',size:28,desc:'Personal hub: nasirr.innergintel.org. Hosts INNERG ID pages and the Market Pulse section.',links:[['nasirr.innergintel.org','https://nasirr.innergintel.org/']]},
 // ecosystem
 {id:'intel',label:'InnerG Intel',group:'venture',size:36,desc:'Parent brand and media arm: SI education, agentic workflows, research and briefings. YouTube @innergintel, X @InnerGIntel.',links:[['YouTube @innergintel','https://www.youtube.com/@innergintel'],['Ecosystem hub','http://www.innergeco.online/']]},
 {id:'learn',label:'InnerG Learn',group:'venture',size:26,desc:'Learning hub for InnerG courses and lessons.',links:[['Site','https://innergclaw.github.io/innerg-learn/'],['Repo',GH+'innerg-learn']]},
 {id:'academy',label:'Agent Academy',group:'venture',size:26,desc:'InnerG Agent Academy ~ 21-day beta teaching people to work with SI agents.',links:[['Site','https://innergclaw.github.io/innerg-agent-academy/'],['Repo',GH+'innerg-agent-academy']]},
 {id:'phillysi',label:'Philly SI Program',group:'venture',size:22,desc:'Local superintelligence education program in Philadelphia.',links:[['Signup','https://innergclaw.github.io/innerg-ai-program-signup/']]},
 {id:'reads',label:'InnerG Reads',group:'venture',size:28,desc:'Publishing imprint with short reads and books by Nasirr Mayo.',links:[['innergreads.study','https://www.innergreads.study/']]},
 {id:'book',label:'Legacy In Ink',group:'venture',size:22,desc:'Legacy In Ink: The Final Frequency ~ InnerG Reads Release 001 (2026).',links:[['Book site','https://innergclaw.github.io/legacy-in-ink-final-frequency/'],['Amazon','https://www.amazon.com/dp/B0HC2WTW1G']]},
 {id:'pulse',label:'INNERG PULSE',group:'venture',size:26,desc:'InnerG Market Pulse ~ financial literacy, stocks and crypto research, watchlists. Research only, not financial advice.',links:[['Watchlist','https://innergclaw.github.io/innerg-watchlist/']]},
 {id:'innergid',label:'INNERG ID',group:'venture',size:28,desc:'Family program for grades 3 to 12 plus parents, with Child, Parent and Family plans and the InnerG Library. Also the member identity layer.',links:[['Plans','https://nasirr.innergintel.org/innergid/'],['For parents','https://nasirr.innergintel.org/innergid/about/']]},
 {id:'library',label:'InnerG Library',group:'venture',size:18,desc:'Learning library included with INNERG ID memberships.',links:[]},
 {id:'oyw',label:'OwnYourWeb Systems',group:'venture',size:32,desc:'Websites and systems for small businesses. "Your website. Your server. Your control." Parent of SHOPNASGFX.',links:[['ownyourweb.xyz','https://ownyourweb.xyz/'],['SMM Tier 1','https://ownyourweb.marketing/']]},
 {id:'shop',label:'SHOPNASGFX',group:'venture',size:28,desc:'Design studio for logos, branding and social media. Lineage: NGVISIONS ~ NasGfx ~ SHOPNASGFX.',links:[['shopnasgfx.com','https://shopnasgfx.com/'],['Portfolio','https://innergclaw.github.io/shopnasgfx-portfolio/']]},
 // clients
 {id:'aam',label:'African American Market',group:'client',size:22,desc:'African American Market at FDR Park, Philadelphia (also called FDR Market). Social content, promo graphics, events.',links:[['aamarketphilly.com','https://aamarketphilly.com/']]},
 {id:'src',label:"SR Children's Lounge",group:'client',size:20,desc:'Website and business maintenance.',links:[['srchildrenslounge.com','https://srchildrenslounge.com/']]},
 {id:'hof',label:'Hand Over Fist Ent.',group:'client',size:20,desc:'Hands Over First / Hand Over Fist Entertainment ~ brand support, including the NICKLE NINE NEET artist site.',links:[['nicklenineneet.com','https://nicklenineneet.com/']]},
 {id:'boxing',label:'10 for 10 Boxing',group:'client',size:20,desc:'Philadelphia boxing gym. Site, logo kit and discount signup.',links:[['10for10boxing.com','https://10for10boxing.com/']]},
 {id:'demos',label:'Client Demos',group:'client',size:18,desc:'Demo and starter sites built for small businesses (Heavens Angels, Blessed by Bri, Allyz World and more).',links:[['Heavens Angels',GH+'heavens-angels-demo'],['Blessed by Bri',GH+'blessedbybri-demo'],['Allyz World','http://www.allyzworldofknowledge.com/']]},
 // agents
 {id:'marrow',label:'MARROW',group:'agent',size:28,desc:'Grok Bot lead teammate: ops, engineering and routing. Keeps the brains current and reports to Mr G. X @innergmarrow.',links:[]},
 {id:'studio',label:'InnerG Studio',group:'agent',size:22,desc:'Content and video teammate: plans YouTube assets and edits footage.',links:[]},
 {id:'a-pulse',label:'Market Pulse',group:'agent',size:20,desc:'Researches and summarizes markets; maintains the watchlist feed. Never trades.',links:[]},
 {id:'a-lab',label:'Trading Lab',group:'agent',size:20,desc:'Tests and documents trading ideas. Never places live trades.',links:[]},
 {id:'a-niche',label:'Niche Lab',group:'agent',size:20,desc:'Finds and grows small niche online businesses under OwnYourWeb Systems.',links:[]},
 {id:'a-editor',label:'Final Frequency Editor',group:'agent',size:20,desc:'Editorial teammate for InnerG Reads and Legacy In Ink.',links:[]},
 {id:'a-soc',label:'SOC Coach',group:'agent',size:20,desc:'Coaching teammate for security operations as Nas starts a SOC role.',links:[]},
 // skills
 {id:'s-web',label:'Web Development',group:'skill',size:28,desc:'Static sites, GitHub Pages, Supabase backends.',links:[]},
 {id:'s-design',label:'Design',group:'skill',size:26,desc:'Logos, brand systems, UI.',links:[]},
 {id:'s-si',label:'SI Orchestration',group:'skill',size:28,desc:'Directing a team of SI teammates with clear jobs and approvals.',links:[]},
 {id:'s-strategy',label:'Strategy',group:'skill',size:24,desc:'Business and brand strategy.',links:[]},
 {id:'s-teach',label:'Teaching',group:'skill',size:24,desc:'SI education for families, students and builders.',links:[]},
 {id:'s-write',label:'Writing',group:'skill',size:24,desc:'Books, reads, copy and scripts.',links:[]},
 {id:'s-trade',label:'Trading Research',group:'skill',size:22,desc:'Markets research and watchlists.',links:[]},
 {id:'s-soc',label:'Security Operations',group:'skill',size:22,desc:'SOC fundamentals ~ new role starting.',links:[]},
 // stack
 {id:'t-gh',label:'GitHub',group:'tool',size:20,desc:'Code home for every project.',links:[['github.com/innergclaw','https://github.com/innergclaw']]},
 {id:'t-pages',label:'GitHub Pages',group:'tool',size:18,desc:'Hosting for the live sites.',links:[]},
 {id:'t-supa',label:'Supabase',group:'tool',size:18,desc:'Database and edge functions (INNERG ID, signups).',links:[]},
 {id:'t-stripe',label:'Stripe',group:'tool',size:16,desc:'Payments.',links:[]},
 {id:'t-x',label:'X',group:'tool',size:16,desc:'@InnerGIntel, @innergmarrow.',links:[['@InnerGIntel','https://x.com/InnerGIntel']]},
 {id:'t-substack',label:'Substack',group:'tool',size:16,desc:'Newsletter publishing.',links:[]},
 {id:'t-discord',label:'Discord',group:'tool',size:16,desc:'Community.',links:[]},
 {id:'t-yt',label:'YouTube',group:'tool',size:16,desc:'Video channel @innergintel.',links:[['@innergintel','https://www.youtube.com/@innergintel']]},
 {id:'t-grok',label:'Grok Bot',group:'tool',size:18,desc:'Platform running the SI teammates since 2026-10-14.',links:[]},
 // legacy
 {id:'l-old',label:'OpenClaw / Codex / Hermes',group:'legacy',size:16,desc:'Legacy agent setup (InnerGClaw era), replaced by the Grok Bot team on 2026-10-14.',links:[]}
],
edges: [
 ['nas','homebase','home'],['nas','intel','founded'],['nas','oyw','founded'],['nas','marrow','leads'],
 ['intel','learn','runs'],['intel','academy','runs'],['intel','phillysi','runs'],['intel','reads','imprint'],['intel','pulse','runs'],['intel','innergid','runs'],
 ['reads','book','publishes'],['innergid','library','includes'],['homebase','innergid','hosts'],['homebase','pulse','shows'],
 ['oyw','shop','parent of'],['oyw','aam','client'],['oyw','src','client'],['oyw','hof','client'],['oyw','boxing','client'],['oyw','demos','builds'],['shop','aam','graphics'],['shop','boxing','logo kit'],
 ['marrow','studio','routes'],['marrow','a-pulse','routes'],['marrow','a-lab','routes'],['marrow','a-niche','routes'],['marrow','a-editor','routes'],['marrow','a-soc','routes'],
 ['studio','intel','content'],['a-pulse','pulse','feeds'],['a-niche','oyw','grows'],['a-editor','book','edits'],['a-soc','s-soc','coaches'],['a-lab','s-trade','tests'],
 ['nas','s-web','skill'],['nas','s-design','skill'],['nas','s-si','skill'],['nas','s-strategy','skill'],['nas','s-teach','skill'],['nas','s-write','skill'],['nas','s-trade','skill'],['nas','s-soc','skill'],
 ['s-web','oyw','powers'],['s-design','shop','powers'],['s-si','marrow','directs'],['s-teach','academy','powers'],['s-teach','innergid','powers'],['s-write','reads','powers'],['s-trade','pulse','powers'],
 ['s-web','t-gh','uses'],['t-gh','t-pages','deploys'],['innergid','t-supa','backend'],['boxing','t-supa','signups'],['oyw','t-stripe','payments'],['intel','t-x','posts'],['pulse','t-substack','publishes'],['intel','t-discord','community'],['intel','t-yt','channel'],['marrow','t-grok','runs on'],
 ['t-grok','l-old','replaced']
].map(([from,to,label])=>({from,to,label}))
};

const C=groups, nodesDS=new vis.DataSet(graphData.nodes.map(({group,...n})=>({...n,cat:group,title:n.label,value:n.size,
  color:{background:C[group].color,border:'#ffffff40',highlight:{background:C[group].color,border:'#fff'},hover:{background:C[group].color,border:'#fff'}},
  shape:'dot',size:n.size*0.6,font:{color:'#ecebff',size:group==='core'?18:13,strokeWidth:4,strokeColor:'#07070c'},
  borderWidth:group==='core'?3:1.5,shadow:{enabled:true,color:C[group].color+'88',size:group==='core'?30:12,x:0,y:0}})));
const edgesDS=new vis.DataSet(graphData.edges.map((e,i)=>({id:i,...e,title:e.label,label:undefined,color:{color:'#ffffff22',highlight:'#f5c542',hover:'#ffffff88'},width:1.2,smooth:{type:'continuous'}})));
const net=new vis.Network(document.getElementById('graph'),{nodes:nodesDS,edges:edgesDS},{
  physics:{solver:'forceAtlas2Based',forceAtlas2Based:{gravitationalConstant:-70,springLength:110,springConstant:.06,damping:.5},stabilization:{iterations:300}},
  interaction:{hover:true,tooltipDelay:150,navigationButtons:false},layout:{improvedLayout:true}});
const byId=Object.fromEntries(graphData.nodes.map(n=>[n.id,n]));
const off=new Set();let radial=false,physics=true;

// legend
const lg=document.getElementById('legend');
Object.entries(C).forEach(([k,g])=>{const d=document.createElement('div');d.className='lg';d.innerHTML=`<span class="dot" style="background:${g.color}"></span>${g.label} (${graphData.nodes.filter(n=>n.group===k).length})`;
 d.onclick=()=>{off.has(k)?off.delete(k):off.add(k);d.classList.toggle('off');applyFilter()};lg.appendChild(d)});
function applyFilter(){const q=document.getElementById('search').value.trim().toLowerCase();
 nodesDS.update(graphData.nodes.map(n=>{const hit=!q||(n.label+' '+n.desc).toLowerCase().includes(q);return{id:n.id,hidden:off.has(n.group),opacity:hit?1:.15}}));}
document.getElementById('search').oninput=applyFilter;
document.getElementById('search').onkeydown=e=>{if(e.key==='Enter'){const q=e.target.value.toLowerCase();const n=graphData.nodes.find(n=>n.label.toLowerCase().includes(q));if(n)focusNode(n.id)}};

function focusNode(id){net.selectNodes([id]);net.focus(id,{scale:1.2,animation:{duration:600,easingFunction:'easeInOutQuad'}});show(id)}
function show(id){const n=byId[id],g=C[n.group];
 const conns=graphData.edges.filter(e=>e.from===id||e.to===id).map(e=>{const o=e.from===id?e.to:e.from;return`<li data-id="${o}">${byId[o].label} <em>~ ${e.label}</em></li>`}).join('');
 document.getElementById('pbody').innerHTML=`<span class="tag" style="background:${g.color}33;color:${g.color}">${g.label}</span><h2>${n.label}</h2><p>${n.desc}</p>`+
 (n.links.length?`<h3>Links</h3>`+n.links.map(([t,u])=>`<div><a href="${u}" target="_blank" rel="noopener">${t} ↗</a></div>`).join(''):'')+`<h3>Connections</h3><ul>${conns}</ul>`;
 document.querySelectorAll('#pbody li').forEach(li=>li.onclick=()=>focusNode(li.dataset.id));
 document.getElementById('panel').classList.add('open');}
net.on('click',p=>{if(p.nodes.length)show(p.nodes[0]);else document.getElementById('panel').classList.remove('open')});
document.getElementById('close').onclick=()=>document.getElementById('panel').classList.remove('open');

// competency (radial) view: Nas at center, rings by group
const rings={core:0.7,skill:1.4,venture:2.2,agent:3,client:3.7,tool:4.4,legacy:5};
function setRadial(on){radial=on;document.getElementById('viewBtn').classList.toggle('on',on);document.getElementById('viewBtn').textContent=on?'Network view':'Competency view';
 if(on){net.setOptions({physics:{enabled:false}});net.stopSimulation();const by={};graphData.nodes.forEach(n=>(by[rings[n.group]]=by[rings[n.group]]||[]).push(n));
  Object.entries(by).forEach(([r,arr])=>arr.forEach((n,i)=>{const R=r*230,a=(i/arr.length)*2*Math.PI+r*.6;n.id==='nas'?net.moveNode(n.id,0,0):net.moveNode(n.id,R*Math.cos(a),R*Math.sin(a))}));
  edgesDS.update(graphData.edges.map((e,i)=>({id:i,hidden:!(e.from==='nas'||e.from==='intel'||e.from==='oyw'||e.from==='marrow')})));
  net.fit({animation:{duration:700}})}
 else{edgesDS.update(graphData.edges.map((e,i)=>({id:i,hidden:false})));net.setOptions({physics:{enabled:physics}});net.stabilize(150)}}
document.getElementById('viewBtn').onclick=()=>setRadial(!radial);
document.getElementById('physBtn').onclick=e=>{physics=!physics;net.setOptions({physics:{enabled:physics&&!radial}});e.target.textContent=physics?'Freeze':'Unfreeze';e.target.classList.toggle('on',!physics)};
document.getElementById('resetBtn').onclick=()=>{off.clear();document.querySelectorAll('.lg').forEach(d=>d.classList.remove('off'));document.getElementById('search').value='';applyFilter();setRadial(false);net.fit({animation:true})};
document.getElementById('exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(graphData,null,2)],{type:'application/json'}));a.download='innerg-skill-graph.json';a.click()};
document.getElementById('stats').textContent=`${graphData.nodes.length} nodes ~ ${graphData.edges.length} connections`;
net.once('stabilizationIterationsDone',()=>net.fit());
</script>
</body>
</html>
